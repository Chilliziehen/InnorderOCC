      responses: { "400": *workflowRequestResponse, "401": *workflowUnauthorizedResponse, "403": *workflowForbiddenResponse, "404": *workflowNotFoundResponse, "503": *workflowAuthorizationUnavailableResponse, "500": *workflowInternalResponse, "200": { description: Task detail, content: { application/json: { schema: { $ref: "#/components/schemas/TaskDetail" } } } } }
  /api/v1/tasks/{taskId}/history:
    get:
      operationId: listTaskHistory
      parameters:
        - *taskId
        - { name: cursor, in: query, schema: { type: string, minLength: 1, maxLength: 4096 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses: { "400": *workflowBadRequestResponse, "401": *workflowUnauthorizedResponse, "403": *workflowForbiddenResponse, "404": *workflowNotFoundResponse, "503": *workflowAuthorizationUnavailableResponse, "500": *workflowInternalResponse, "200": { description: Task history, content: { application/json: { schema: { $ref: "#/components/schemas/TaskHistoryPage" } } } } }
  /api/v1/tasks/{taskId}/blockers:
    get:
      operationId: listTaskBlockers
      parameters:
        - *taskId
        - { name: cursor, in: query, schema: { type: string, minLength: 1, maxLength: 4096 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses: { "400": *workflowBadRequestResponse, "401": *workflowUnauthorizedResponse, "403": *workflowForbiddenResponse, "404": *workflowNotFoundResponse, "503": *workflowAuthorizationUnavailableResponse, "500": *workflowInternalResponse, "200": { description: Task blockers, content: { application/json: { schema: { $ref: "#/components/schemas/TaskBlockerPage" } } } } }
  /api/v1/tasks/{taskId}/claim:
    post:
      operationId: claimTask
      parameters: [*taskId, *idempotencyKey]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ClaimTaskRequest" } } } }
      responses: { "400": *workflowRequestResponse, "401": *workflowUnauthorizedResponse, "403": *workflowForbiddenResponse, "404": *workflowNotFoundResponse, "503": *workflowUnavailableResponse, "500": *workflowInternalResponse, "200": { description: Task claimed, headers: { X-Idempotent-Replay: { $ref: "#/components/headers/IdempotentReplay" } }, content: { application/json: { schema: { $ref: "#/components/schemas/TaskDetail" } } } }, "409": { $ref: "#/components/responses/TaskClaimConflict" } }
  /api/v1/tasks/{taskId}/complete:
    post:
      operationId: completeTask
      parameters: [*taskId, *idempotencyKey]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CompleteTaskRequest" } } } }
      responses: { "400": *workflowRequestResponse, "401": *workflowUnauthorizedResponse, "403": *workflowForbiddenResponse, "404": *workflowNotFoundResponse, "503": { $ref: "#/components/responses/TaskGateUnavailable" }, "500": *workflowInternalResponse, "200": { description: Task completed, headers: { X-Idempotent-Replay: { $ref: "#/components/headers/IdempotentReplay" } }, content: { application/json: { schema: { $ref: "#/components/schemas/TaskDetail" } } } }, "409": { $ref: "#/components/responses/TaskBlocked" } }
  /api/v1/tasks/{taskId}/fail:
    post:
      operationId: failTask
      parameters: [*taskId, *idempotencyKey]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/FailTaskRequest" } } } }
      responses: { "400": *workflowRequestResponse, "401": *workflowUnauthorizedResponse, "403": *workflowForbiddenResponse, "404": *workflowNotFoundResponse, "503": *workflowUnavailableResponse, "500": *workflowInternalResponse, "200": { description: Task failed, headers: { X-Idempotent-Replay: { $ref: "#/components/headers/IdempotentReplay" } }, content: { application/json: { schema: { $ref: "#/components/schemas/TaskDetail" } } } }, "409": { $ref: "#/components/responses/TaskCommandConflict" } }
  /api/v1/me/notifications:
    get:
      operationId: listNotifications
      parameters:
        - { name: unread, in: query, schema: { type: boolean } }
        - { name: type, in: query, schema: { $ref: "#/components/schemas/NotificationType" } }
        - { name: severity, in: query, schema: { $ref: "#/components/schemas/NotificationSeverity" } }
        - { name: createdBefore, in: query, schema: { type: string, format: date-time } }
        - { name: cursor, in: query, schema: { type: string, minLength: 1, maxLength: 4096 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses: { "400": *workflowBadRequestResponse, "401": *workflowUnauthorizedResponse, "403": *workflowForbiddenResponse, "503": *workflowAuthorizationUnavailableResponse, "500": *workflowInternalResponse, "200": { description: Notifications, content: { application/json: { schema: { $ref: "#/components/schemas/NotificationPage" } } } } }
  /api/v1/me/notifications/{notificationId}/read:
    post:
      operationId: markNotificationRead
      parameters: [*notificationId, *idempotencyKey]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MarkNotificationReadRequest" } } } }
      responses: { "400": *workflowRequestResponse, "401": *workflowUnauthorizedResponse, "403": *workflowForbiddenResponse, "404": *workflowNotFoundResponse, "503": *workflowAuthorizationUnavailableResponse, "500": *workflowInternalResponse, "200": { description: Notification marked read, headers: { X-Idempotent-Replay: { $ref: "#/components/headers/IdempotentReplay" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Notification" } } } }, "409": { $ref: "#/components/responses/VersionedCommandConflict" } }
  /api/v1/events:
    get:
      operationId: catchUpAuthorizedEvents
      parameters:
        - { name: cursor, in: query, schema: { type: string, minLength: 1, maxLength: 4096 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: filter, in: query, schema: { type: string, enum: [cohort.created, cohort.updated, cohort.owner-transferred, cohort.member-added, cohort.member-removed, cohort.activated, cohort.archived, process.started, process.suspended, process.resumed, process.transferred, process.completed, process.cancelled, process.failed, process.projection-reconciled, task.available, task.claimed, task.assignee-changed, task.blocked, task.pending-review, task.returned, task.completed, task.cancelled, task.failed, task.projection-reconciled] } }
      responses: { "400": *workflowBadRequestResponse, "401": *workflowUnauthorizedResponse, "403": *workflowForbiddenResponse, "503": *workflowAuthorizationUnavailableResponse, "500": *workflowInternalResponse, "200": { description: Currently authorized event catch-up, content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowEventPage" } } } } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[!-~]{1,128}$"
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
    ExpectedVersion:
      name: Expected-Version
      in: header
      required: true
      schema:
        type: integer
        format: int64
        minimum: 0
        maximum: 9007199254740991
    ExpectedVersionIfResubmitting:
      name: Expected-Version
      in: header
      required: false
      description: Required when evidenceId identifies an existing evidence head for resubmission
      schema:
        type: integer
        format: int64
        minimum: 0
        maximum: 9007199254740991
    Range:
      name: Range
      in: header
      required: false
      description: A single bounded HTTP byte range
      schema:
        type: string
        maxLength: 39
        pattern: "^bytes=(?:[0-9]{1,16}-[0-9]{0,16}|-[1-9][0-9]{0,15})$"
        x-occ-semantic-validation:
          validator: evidenceRangeHeaderSchema
          rules:
            - suffix-length-positive
            - offsets-js-safe-integers
            - end-not-before-start
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/OpaqueCursor"
    PageLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    RiskSeverityFilter:
      name: severity
      in: query
      required: false
      schema:
        type: array
        minItems: 1
        maxItems: 3
        items:
          $ref: "#/components/schemas/RiskSeverity"
    RiskStateFilter:
      name: state
      in: query
      required: false
      schema:
        type: array
        minItems: 1
        maxItems: 4
        items:
          $ref: "#/components/schemas/RiskState"
    RiskSlaStatusFilter:
      name: slaStatus
      in: query
      required: false
      schema:
        type: array
        minItems: 1
        maxItems: 4
        items:
          $ref: "#/components/schemas/RiskSlaStatus"
    TargetEntityFilter:
      name: targetEntityId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    OwnerRelationshipFilter:
      name: ownerRelationshipId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    SignificantOnlyFilter:
      name: significantOnly
      in: query
      required: false
      schema:
        type: boolean
    OwnedByMeFilter:
      name: ownedByMe
      in: query
      required: false
      schema:
        type: boolean
    ResourceTypeFilter:
      name: resourceType
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ResourceStateFilter:
      name: state
      in: query
      required: false
      schema:
        type: array
        minItems: 1
        maxItems: 4
        items:
          $ref: "#/components/schemas/ResourceState"
    MinimumCapacityFilter:
      name: minimumCapacity
      in: query
      required: false
      schema:
        type: number
        exclusiveMinimum: 0
        maximum: 9007199254740991
    ScheduleFrom:
      name: from
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/OffsetInstant"
    ScheduleUntil:
      name: until
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/OffsetInstant"
    ReservationStateFilter:
      name: state
      in: query
      required: false
      schema:
        type: array
        minItems: 1
        maxItems: 4
        items:
          $ref: "#/components/schemas/ReservationState"
    RequirementId:
      name: requirementId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UploadSessionId:
      name: uploadSessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EvidenceId:
      name: evidenceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RiskId:
      name: riskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ResourceId:
      name: resourceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReservationId:
      name: reservationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    IdempotentReplay:
      description: Whether the successful command response was replayed
      schema:
        type: string
        enum: ["true", "false"]
    CorrelationId:
      description: Correlation UUID for this request and its emitted work
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyReplayed:
      description: True when the command response was replayed from the idempotency record
      required: true
      schema:
        type: boolean
    AcceptRanges:
      description: Supported range unit
      required: true
      schema:
        type: string
        const: bytes
    ContentRange:
      description: Inclusive byte range and complete representation length
      required: true
      schema:
        type: string
        maxLength: 56
        pattern: "^bytes [0-9]{1,16}-[0-9]{1,16}/[0-9]{1,16}$"
    UnsatisfiedContentRange:
      description: Complete representation length for an unsatisfied range
      required: true
      schema:
        type: string
        maxLength: 24
        pattern: "^bytes \\*/[0-9]{1,16}$"
  responses:
    WorkflowRequestError: { description: Invalid workflow request, content: { application/problem+json: { schema: { $ref: "#/components/schemas/WorkflowRequestProblem" } } } }
    WorkflowBadRequest: { description: Invalid workflow request or cursor, content: { application/problem+json: { schema: { $ref: "#/components/schemas/WorkflowBadRequestProblem" } } } }
    WorkflowUnauthorized: { description: Workflow authentication is required, content: { application/problem+json: { schema: { $ref: "#/components/schemas/WorkflowUnauthorizedProblem" } } } }
    WorkflowForbidden: { description: Workflow action is forbidden, content: { application/problem+json: { schema: { $ref: "#/components/schemas/WorkflowForbiddenProblem" } } } }
    WorkflowNotFound: { description: Workflow resource was not found or is not visible, content: { application/problem+json: { schema: { $ref: "#/components/schemas/WorkflowNotFoundProblem" } } } }
    WorkflowInternalError: { description: Unexpected workflow failure, content: { application/problem+json: { schema: { $ref: "#/components/schemas/WorkflowInternalProblem" } } } }
    WorkflowAuthorizationUnavailable: { description: Workflow authorization is unavailable, content: { application/problem+json: { schema: { $ref: "#/components/schemas/WorkflowAuthorizationUnavailableProblem" } } } }
    WorkflowUnavailable: { description: Workflow authorization or engine is unavailable, content: { application/problem+json: { schema: { $ref: "#/components/schemas/WorkflowUnavailableProblem" } } } }
    CohortCreationConflict: { description: Cohort creation conflict, content: { application/problem+json: { schema: { $ref: "#/components/schemas/CohortCreationConflictProblem" } } } }
    VersionedCommandConflict: { description: Versioned command conflict, content: { application/problem+json: { schema: { $ref: "#/components/schemas/VersionedCommandConflictProblem" } } } }
    ParticipantProcessStartConflict: { description: Participant process start conflict, content: { application/problem+json: { schema: { $ref: "#/components/schemas/ParticipantProcessStartConflictProblem" } } } }
    ProcessCommandConflict: { description: Process command conflict, content: { application/problem+json: { schema: { $ref: "#/components/schemas/ProcessCommandConflictProblem" } } } }
    ProcessTransferConflict: { description: Process transfer conflict, content: { application/problem+json: { schema: { $ref: "#/components/schemas/ProcessTransferConflictProblem" } } } }
    ProcessWaitReleaseConflict: { description: Process wait release conflict, content: { application/problem+json: { schema: { $ref: "#/components/schemas/ProcessWaitReleaseConflictProblem" } } } }
    TaskClaimConflict: { description: Task claim conflict, content: { application/problem+json: { schema: { $ref: "#/components/schemas/TaskClaimConflictProblem" } } } }
    TaskCommandConflict: { description: Task command conflict, content: { application/problem+json: { schema: { $ref: "#/components/schemas/TaskCommandConflictProblem" } } } }
    TaskBlocked:
      description: Authorized blocker details prevent task completion
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/TaskCompletionConflictProblem"
    TaskGateUnavailable:
      description: Authorized provider details are unavailable or stale
      content:
        application/problem+json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/TaskGateUnavailableProblem"
              - $ref: "#/components/schemas/TaskCompletionDependencyProblem"
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Unauthorized:
      description: Authentication is required or invalid
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Forbidden:
      description: The authenticated principal is not authorized for the target
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    NotFound:
      description: The authorized target does not exist
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Conflict:
      description: Idempotency, optimistic version, or lifecycle conflict
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ReservationConflict:
      description: Reservation overlaps exclusivity, capacity, or availability constraints
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ReservationConflictProblem"
    EvidenceUploadConflict:
      description: Evidence upload session or content lifecycle conflict
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/EvidenceUploadConflictProblem"
    EvidenceReviewConflict:
      description: Evidence review lifecycle conflict
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/EvidenceReviewConflictProblem"
    RiskInvalidTransition:
      description: Risk action is invalid for the current lifecycle state
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/RiskInvalidTransitionProblem"
    ResourceUnavailable:
      description: Managed resource state or availability rejects the command
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ResourceUnavailableProblem"
    VersionConflict:
      description: Expected-Version does not match the current aggregate version
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/VersionConflictProblem"
    EvidenceUploadSessionConflict:
      description: Upload-session kernel, version, or evidence lifecycle conflict
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/EvidenceUploadSessionConflictProblem" }
    EvidenceContentConflict:
      description: Evidence-content kernel or upload lifecycle conflict
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/EvidenceContentConflictProblem" }
    EvidenceSubmitConflict:
      description: Evidence submission kernel, optimistic, or upload lifecycle conflict
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/EvidenceSubmitConflictProblem" }
    EvidenceReviewCommandConflict:
      description: Evidence review kernel, optimistic, or lifecycle conflict
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/EvidenceReviewCommandConflictProblem" }
    RiskActionConflict:
      description: Risk action kernel, optimistic, or lifecycle conflict
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/RiskActionConflictProblem" }
    RiskAdjudicationConflict:
      description: Risk adjudication idempotency conflict
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/RiskAdjudicationConflictProblem" }
    ResourceUpdateConflict:
      description: Resource update kernel, optimistic, availability, or reservation conflict
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ResourceUpdateConflictProblem" }
    ResourceAvailabilityConflict:
      description: Availability command kernel, optimistic, resource, or reservation conflict
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ResourceAvailabilityConflictProblem" }
    ReservationCreateConflict:
      description: Reservation create kernel, resource, or reservation conflict
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ReservationCreateConflictProblem" }
    ReservationChangeConflict:
      description: Reservation change kernel, optimistic, resource, or reservation conflict
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ReservationChangeConflictProblem" }
    ReservationCancelConflict:
      description: Reservation cancellation kernel or optimistic conflict
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ReservationCancelConflictProblem" }
    AuthorizationUnavailable:
      description: Authorization policy is unavailable or stale
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/AuthorizationUnavailableProblem" }
    CommandUnavailable:
      description: Authorization or command integrity prevents a protected mutation
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProtectedCommandUnavailableProblem" }
    PayloadTooLarge:
      description: Evidence content exceeds the declared or 100 MiB limit
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/EvidenceTooLargeProblem"
    UnprocessableContent:
      description: Evidence digest, media, inspection, or scanner validation failed closed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/UnprocessableContentProblem"
    InvalidRange:
      description: Requested evidence byte range is invalid
      headers:
        Accept-Ranges:
          $ref: "#/components/headers/AcceptRanges"
        Content-Range:
          $ref: "#/components/headers/UnsatisfiedContentRange"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/InvalidRangeProblem"
    TooManyRequests:
      description: Request rate limit exceeded
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    InternalServerError:
      description: Unexpected server error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
  schemas:
    ProblemCode:
      type: string
      enum:
        - OCC-API-VALIDATION
        - OCC-API-AUTHENTICATION
        - OCC-AUTH-INVALID-CREDENTIALS
        - OCC-API-FORBIDDEN
        - OCC-API-CONFLICT
        - OCC-COMMAND-IDEMPOTENCY-KEY
        - OCC-COMMAND-IDEMPOTENCY-CONFLICT
        - OCC-COMMAND-METADATA
        - OCC-COMMAND-IDEMPOTENCY-IN-PROGRESS
        - OCC-COMMAND-IDEMPOTENCY-EXPIRED
        - OCC-COMMAND-INTEGRITY
        - OCC-COMMAND-OPTIMISTIC-CONFLICT
        - OCC-AUTHZ-UNAVAILABLE
        - OCC-API-INTERNAL
        - OCC-API-REQUEST
        - OCC_INVALID_REQUEST
        - OCC_INVALID_CURSOR
        - OCC_UNAUTHENTICATED
        - OCC_FORBIDDEN
        - OCC_NOT_FOUND
        - OCC_IDEMPOTENCY_CONFLICT
        - OCC_DUPLICATE_COHORT_CODE
        - OCC_STALE_VERSION
        - OCC_CLAIM_CONFLICT
        - OCC_PARTICIPANT_PROCESS_EXISTS
        - OCC_INVALID_TRANSITION
        - OCC_PROCESS_NOT_RUNNING
        - OCC_TASK_BLOCKED
        - OCC_WAIT_NOT_ACTIVE
        - OCC_TASK_GATE_UNAVAILABLE
        - OCC_AUTHORIZATION_UNAVAILABLE
        - OCC_WORKFLOW_UNAVAILABLE
        - OCC_INTERNAL_ERROR
    BaseProblemCode:
      type: string
      enum: [OCC-API-VALIDATION, OCC-API-AUTHENTICATION, OCC-AUTH-INVALID-CREDENTIALS, OCC-API-FORBIDDEN, OCC-API-CONFLICT, OCC-COMMAND-IDEMPOTENCY-KEY, OCC-COMMAND-IDEMPOTENCY-CONFLICT, OCC-COMMAND-METADATA, OCC-COMMAND-IDEMPOTENCY-IN-PROGRESS, OCC-COMMAND-IDEMPOTENCY-EXPIRED, OCC-COMMAND-INTEGRITY, OCC-COMMAND-OPTIMISTIC-CONFLICT, OCC-AUTHZ-UNAVAILABLE, OCC-API-INTERNAL, OCC-API-REQUEST, OCC-INVALID-REQUEST, OCC-AUTHENTICATION-REQUIRED, OCC-FORBIDDEN, OCC-NOT-FOUND, OCC-IDEMPOTENCY-CONFLICT, OCC-VERSION-CONFLICT, OCC-EVIDENCE-TOO-LARGE, OCC-EVIDENCE-DIGEST-MISMATCH, OCC-EVIDENCE-INVALID-CONTENT, OCC-EVIDENCE-UPLOAD-CONFLICT, OCC-EVIDENCE-REVIEW-CONFLICT, OCC-RISK-INVALID-TRANSITION, OCC-RESOURCE-UNAVAILABLE, OCC-RESERVATION-CONFLICT, OCC-INTERNAL-ERROR, OCC_INVALID_REQUEST, OCC_INVALID_CURSOR, OCC_UNAUTHENTICATED, OCC_FORBIDDEN, OCC_NOT_FOUND, OCC_IDEMPOTENCY_CONFLICT, OCC_DUPLICATE_COHORT_CODE, OCC_CLAIM_CONFLICT, OCC_INVALID_TRANSITION, OCC_PROCESS_NOT_RUNNING, OCC_TASK_BLOCKED, OCC_WAIT_NOT_ACTIVE, OCC_TASK_GATE_UNAVAILABLE, OCC_AUTHORIZATION_UNAVAILABLE, OCC_WORKFLOW_UNAVAILABLE, OCC_INTERNAL_ERROR]
    ProblemDetails:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - code
        - correlationId
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          minLength: 1
          maxLength: 256
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          $ref: "#/components/schemas/BaseProblemCode"
        correlationId:
          type: string
          format: uuid
        detail:
          type: string
          minLength: 0
          maxLength: 4096
        currentVersion:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
    EvidenceUploadConflictProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemDetails"
        - type: object
          properties:
            status: { const: 409 }
            code: { const: OCC-EVIDENCE-UPLOAD-CONFLICT }
    EvidenceReviewConflictProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemDetails"
        - type: object
          properties:
            status: { const: 409 }
            code: { const: OCC-EVIDENCE-REVIEW-CONFLICT }
    RiskInvalidTransitionProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemDetails"
        - type: object
          properties:
            status: { const: 409 }
            code: { const: OCC-RISK-INVALID-TRANSITION }
    ResourceUnavailableProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemDetails"
        - type: object
