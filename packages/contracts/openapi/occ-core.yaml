openapi: 3.1.0
info:
  title: Innorder OCC Core API
  version: 0.1.0
security:
  - bearerAuth: []
x-command-parameters: &commandParameters
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CorrelationId"
x-update-command-parameters: &updateCommandParameters
  - $ref: "#/components/parameters/IdempotencyKey"
  - $ref: "#/components/parameters/CorrelationId"
  - $ref: "#/components/parameters/ExpectedVersion"
x-command-response-headers: &commandResponseHeaders
  X-Correlation-ID:
    $ref: "#/components/headers/CorrelationId"
  Idempotency-Replayed:
    $ref: "#/components/headers/IdempotencyReplayed"
x-workflow-request-response: &workflowRequestResponse { $ref: "#/components/responses/WorkflowRequestError" }
x-workflow-bad-request-response: &workflowBadRequestResponse { $ref: "#/components/responses/WorkflowBadRequest" }
x-workflow-unauthorized-response: &workflowUnauthorizedResponse { $ref: "#/components/responses/WorkflowUnauthorized" }
x-workflow-forbidden-response: &workflowForbiddenResponse { $ref: "#/components/responses/WorkflowForbidden" }
x-workflow-not-found-response: &workflowNotFoundResponse { $ref: "#/components/responses/WorkflowNotFound" }
x-workflow-internal-response: &workflowInternalResponse { $ref: "#/components/responses/WorkflowInternalError" }
x-workflow-authorization-unavailable-response: &workflowAuthorizationUnavailableResponse { $ref: "#/components/responses/WorkflowAuthorizationUnavailable" }
x-workflow-unavailable-response: &workflowUnavailableResponse { $ref: "#/components/responses/WorkflowUnavailable" }
x-idempotency-key: &idempotencyKey
  name: Idempotency-Key
  in: header
  required: true
  schema: { type: string, minLength: 1, maxLength: 256 }
x-cohort-id: &cohortId
  name: cohortId
  in: path
  required: true
  schema: { type: string, format: uuid }
x-participant-id: &participantId
  name: participantId
  in: path
  required: true
  schema: { type: string, format: uuid }
x-process-id: &processId
  name: processId
  in: path
  required: true
  schema: { type: string, format: uuid }
x-task-id: &taskId
  name: taskId
  in: path
  required: true
  schema: { type: string, format: uuid }
x-notification-id: &notificationId
  name: notificationId
  in: path
  required: true
  schema: { type: string, format: uuid }
x-activity-key: &activityKey
  name: activityKey
  in: path
  required: true
  schema: { type: string, minLength: 1, maxLength: 128, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
paths:
  /api/v1/system/status:
    get:
      operationId: getSystemStatus
      security: []
      responses:
        "200":
          description: Current OCC Core service and component status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated session tokens and current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/auth/refresh:
    post:
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Rotated session tokens and current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/auth/logout:
    post:
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Session revoked
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/me:
    get:
      operationId: getCurrentUser
      responses:
        "200":
          description: Current authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/evidence/requirements:
    get:
      operationId: listEvidenceRequirements
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Published evidence requirements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceRequirementPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/AuthorizationUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/evidence/requirements/{requirementId}:
    parameters:
      - $ref: "#/components/parameters/RequirementId"
    get:
      operationId: getEvidenceRequirement
      responses:
        "200":
          description: Published evidence requirement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceRequirement"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/AuthorizationUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/evidence/upload-sessions:
    post:
      operationId: createEvidenceUploadSession
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ExpectedVersionIfResubmitting"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEvidenceUploadSessionRequest"
      responses:
        "201":
          description: Upload session created
          headers: *commandResponseHeaders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceUploadSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/EvidenceUploadSessionConflict"
        "503":
          $ref: "#/components/responses/CommandUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/evidence/upload-sessions/{uploadSessionId}:
    parameters:
      - $ref: "#/components/parameters/UploadSessionId"
    get:
      operationId: getEvidenceUploadSession
      responses:
        "200":
          description: Current upload processing status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceUploadSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/AuthorizationUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/evidence/upload-sessions/{uploadSessionId}/content:
    parameters:
      - $ref: "#/components/parameters/UploadSessionId"
    put:
      operationId: uploadEvidenceContent
      parameters: *commandParameters
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              maxLength: 104857600
      responses:
        "200":
          description: Terminal or observable upload result
          headers: *commandResponseHeaders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceContentResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/EvidenceContentConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "503":
          $ref: "#/components/responses/CommandUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/evidence/{evidenceId}:
    parameters:
      - $ref: "#/components/parameters/EvidenceId"
    get:
      operationId: getEvidenceMetadata
      responses:
        "200":
          description: Authorized evidence metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceMetadata"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/AuthorizationUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/evidence/{evidenceId}/submit:
    parameters:
      - $ref: "#/components/parameters/EvidenceId"
    post:
      operationId: submitEvidence
      parameters: *updateCommandParameters
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitEvidenceRequest"
      responses:
        "200":
          description: Submitted evidence
          headers: *commandResponseHeaders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceMetadata"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/EvidenceSubmitConflict"
        "503":
          $ref: "#/components/responses/CommandUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/evidence/{evidenceId}/reviews:
    parameters:
      - $ref: "#/components/parameters/EvidenceId"
    get:
      operationId: listEvidenceReviews
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Immutable evidence review history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceReviewPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/AuthorizationUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      operationId: reviewEvidence
      parameters: *updateCommandParameters
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewEvidenceRequest"
      responses:
        "201":
          description: Immutable evidence review
          headers: *commandResponseHeaders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceReview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/EvidenceReviewCommandConflict"
        "503":
          $ref: "#/components/responses/CommandUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/evidence/{evidenceId}/versions:
    parameters:
      - $ref: "#/components/parameters/EvidenceId"
    get:
      operationId: listEvidenceVersions
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Immutable evidence version history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceVersionPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/AuthorizationUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/evidence/{evidenceId}/preview:
    parameters:
      - $ref: "#/components/parameters/EvidenceId"
    get:
      operationId: getEvidencePreview
      responses:
        "200":
          description: Metadata for a separately generated sanitized preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidencePreviewMetadata"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/AuthorizationUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/evidence/{evidenceId}/download:
    parameters:
      - $ref: "#/components/parameters/EvidenceId"
    get:
      operationId: downloadEvidence
      parameters:
        - $ref: "#/components/parameters/Range"
      responses:
        "200":
          description: Authorized evidence attachment streamed by Core
          headers:
            Content-Disposition:
              required: true
              schema:
                type: string
            X-Content-Type-Options:
              required: true
              schema:
                type: string
                const: nosniff
            Digest:
              required: true
              schema:
                type: string
            Accept-Ranges:
              $ref: "#/components/headers/AcceptRanges"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
                maxLength: 104857600
        "206":
          description: Authorized partial evidence attachment streamed by Core
          headers:
            Content-Disposition:
              required: true
              schema:
                type: string
            X-Content-Type-Options:
              required: true
              schema:
                type: string
                const: nosniff
            Digest:
              required: true
              schema:
                type: string
            Accept-Ranges:
              $ref: "#/components/headers/AcceptRanges"
            Content-Range:
              $ref: "#/components/headers/ContentRange"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
                maxLength: 104857600
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "416":
          $ref: "#/components/responses/InvalidRange"
        "503":
          $ref: "#/components/responses/AuthorizationUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/evidence/{evidenceId}/download-metadata:
    parameters:
      - $ref: "#/components/parameters/EvidenceId"
    get:
      operationId: getEvidenceDownloadMetadata
      responses:
        "200":
          description: Safe attachment metadata without internal object identifiers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceDownloadMetadata"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/AuthorizationUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/risks:
    get:
      operationId: listRisks
      parameters:
        - $ref: "#/components/parameters/RiskSeverityFilter"
        - $ref: "#/components/parameters/RiskStateFilter"
        - $ref: "#/components/parameters/RiskSlaStatusFilter"
        - $ref: "#/components/parameters/TargetEntityFilter"
        - $ref: "#/components/parameters/OwnerRelationshipFilter"
        - $ref: "#/components/parameters/SignificantOnlyFilter"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Authorized risks matching the supplied filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/AuthorizationUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/risks/{riskId}:
    parameters:
      - $ref: "#/components/parameters/RiskId"
    get:
      operationId: getRisk
      responses:
        "200":
          description: Authorized risk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Risk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/AuthorizationUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/risks/{riskId}/actions:
    parameters:
      - $ref: "#/components/parameters/RiskId"
    get:
      operationId: listRiskActions
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Immutable risk action history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskActionPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/AuthorizationUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      operationId: actOnRisk
      parameters: *updateCommandParameters
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RiskActionCommandRequest"
      responses:
        "201":
          description: Immutable risk action
          headers: *commandResponseHeaders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskAction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/RiskActionConflict"
        "503":
          $ref: "#/components/responses/CommandUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/risks/interventions:
    get:
      operationId: listRiskInterventions
      parameters:
        - $ref: "#/components/parameters/RiskSeverityFilter"
        - $ref: "#/components/parameters/RiskStateFilter"
        - $ref: "#/components/parameters/RiskSlaStatusFilter"
        - $ref: "#/components/parameters/TargetEntityFilter"
        - $ref: "#/components/parameters/OwnedByMeFilter"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Authorized intervention queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterventionPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/AuthorizationUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/risks/adjudications:
    get:
      operationId: listRiskAdjudications
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Immutable risk adjudication history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskAdjudicationPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/AuthorizationUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      operationId: createRiskAdjudication
      parameters: *commandParameters
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRiskAdjudicationRequest"
      responses:
        "201":
          description: Immutable risk adjudication
          headers: *commandResponseHeaders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskAdjudication"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/RiskAdjudicationConflict"
        "503":
          $ref: "#/components/responses/CommandUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/risks/metrics:
    get:
      operationId: getRiskMetrics
      responses:
        "200":
          description: Metrics derived from persisted risk facts and adjudications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskMetrics"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/AuthorizationUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/risks/evaluations/latest:
    get:
      operationId: getLatestRiskEvaluation
      responses:
        "200":
          description: Summary of the latest deterministic risk evaluation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskEvaluationSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/AuthorizationUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/resources:
    get:
      operationId: listManagedResources
      parameters:
        - $ref: "#/components/parameters/ResourceTypeFilter"
        - $ref: "#/components/parameters/ResourceStateFilter"
        - $ref: "#/components/parameters/MinimumCapacityFilter"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Authorized managed resources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedResourcePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/AuthorizationUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/resources/{resourceId}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      operationId: getManagedResource
      responses:
        "200":
          description: Authorized managed resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedResource"
        "401":
