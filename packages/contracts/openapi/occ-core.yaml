    TaskCancelledEvent: { x-occ-aggregate-id-field: payload.taskId, allOf: [{ $ref: "#/components/schemas/EventEnvelope" }, { type: object, required: [type, schemaVersion, aggregateType, payload], properties: { type: { const: task.cancelled }, schemaVersion: { const: 1 }, aggregateType: { const: TASK }, payload: { $ref: "#/components/schemas/TaskCancelledPayload" } } }] }
