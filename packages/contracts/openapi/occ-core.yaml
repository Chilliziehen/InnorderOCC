    TaskAvailableEvent: { x-occ-aggregate-id-field: payload.taskId, allOf: [{ $ref: "#/components/schemas/EventEnvelope" }, { type: object, required: [type, schemaVersion, aggregateType, payload], properties: { type: { const: task.available }, schemaVersion: { const: 1 }, aggregateType: { const: TASK }, payload: { $ref: "#/components/schemas/TaskAvailablePayload" } } }] }
    TaskClaimedEvent: { x-occ-aggregate-id-field: payload.taskId, allOf: [{ $ref: "#/components/schemas/EventEnvelope" }, { type: object, required: [type, schemaVersion, aggregateType, payload], properties: { type: { const: task.claimed }, schemaVersion: { const: 1 }, aggregateType: { const: TASK }, payload: { $ref: "#/components/schemas/TaskClaimedPayload" } } }] }
    TaskAssigneeChangedEvent: { x-occ-aggregate-id-field: payload.taskId, allOf: [{ $ref: "#/components/schemas/EventEnvelope" }, { type: object, required: [type, schemaVersion, aggregateType, payload], properties: { type: { const: task.assignee-changed }, schemaVersion: { const: 1 }, aggregateType: { const: TASK }, payload: { $ref: "#/components/schemas/TaskAssigneeChangedPayload" } } }] }
