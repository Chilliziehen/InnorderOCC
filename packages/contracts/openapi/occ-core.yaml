    CohortOwnerTransferredEvent: { x-occ-aggregate-id-field: payload.cohortId, allOf: [{ $ref: "#/components/schemas/EventEnvelope" }, { type: object, required: [type, schemaVersion, aggregateType, payload], properties: { type: { const: cohort.owner-transferred }, schemaVersion: { const: 1 }, aggregateType: { const: COHORT }, payload: { $ref: "#/components/schemas/CohortOwnerTransferredPayload" } } }] }
    CohortMemberAddedEvent: { x-occ-aggregate-id-field: payload.cohortId, allOf: [{ $ref: "#/components/schemas/EventEnvelope" }, { type: object, required: [type, schemaVersion, aggregateType, payload], properties: { type: { const: cohort.member-added }, schemaVersion: { const: 1 }, aggregateType: { const: COHORT }, payload: { $ref: "#/components/schemas/CohortMemberAddedPayload" } } }] }
    CohortMemberRemovedEvent: { x-occ-aggregate-id-field: payload.cohortId, allOf: [{ $ref: "#/components/schemas/EventEnvelope" }, { type: object, required: [type, schemaVersion, aggregateType, payload], properties: { type: { const: cohort.member-removed }, schemaVersion: { const: 1 }, aggregateType: { const: COHORT }, payload: { $ref: "#/components/schemas/CohortMemberRemovedPayload" } } }] }
    CohortActivatedEvent: { x-occ-aggregate-id-field: payload.cohortId, allOf: [{ $ref: "#/components/schemas/EventEnvelope" }, { type: object, required: [type, schemaVersion, aggregateType, payload], properties: { type: { const: cohort.activated }, schemaVersion: { const: 1 }, aggregateType: { const: COHORT }, payload: { $ref: "#/components/schemas/CohortActivatedPayload" } } }] }
    CohortArchivedEvent: { x-occ-aggregate-id-field: payload.cohortId, allOf: [{ $ref: "#/components/schemas/EventEnvelope" }, { type: object, required: [type, schemaVersion, aggregateType, payload], properties: { type: { const: cohort.archived }, schemaVersion: { const: 1 }, aggregateType: { const: COHORT }, payload: { $ref: "#/components/schemas/CohortArchivedPayload" } } }] }
    ProcessStartedEvent: { x-occ-aggregate-id-field: payload.processId, allOf: [{ $ref: "#/components/schemas/EventEnvelope" }, { type: object, required: [type, schemaVersion, aggregateType, payload], properties: { type: { const: process.started }, schemaVersion: { const: 1 }, aggregateType: { const: PROCESS }, payload: { $ref: "#/components/schemas/ProcessStartedPayload" } } }] }
    ProcessSuspendedEvent: { x-occ-aggregate-id-field: payload.processId, allOf: [{ $ref: "#/components/schemas/EventEnvelope" }, { type: object, required: [type, schemaVersion, aggregateType, payload], properties: { type: { const: process.suspended }, schemaVersion: { const: 1 }, aggregateType: { const: PROCESS }, payload: { $ref: "#/components/schemas/ProcessSuspendedPayload" } } }] }
    ProcessResumedEvent: { x-occ-aggregate-id-field: payload.processId, allOf: [{ $ref: "#/components/schemas/EventEnvelope" }, { type: object, required: [type, schemaVersion, aggregateType, payload], properties: { type: { const: process.resumed }, schemaVersion: { const: 1 }, aggregateType: { const: PROCESS }, payload: { $ref: "#/components/schemas/ProcessResumedPayload" } } }] }
    ProcessTransferredEvent: { x-occ-aggregate-id-field: payload.processId, allOf: [{ $ref: "#/components/schemas/EventEnvelope" }, { type: object, required: [type, schemaVersion, aggregateType, payload], properties: { type: { const: process.transferred }, schemaVersion: { const: 1 }, aggregateType: { const: PROCESS }, payload: { $ref: "#/components/schemas/ProcessTransferredPayload" } } }] }
    ProcessCompletedEvent: { x-occ-aggregate-id-field: payload.processId, allOf: [{ $ref: "#/components/schemas/EventEnvelope" }, { type: object, required: [type, schemaVersion, aggregateType, payload], properties: { type: { const: process.completed }, schemaVersion: { const: 1 }, aggregateType: { const: PROCESS }, payload: { $ref: "#/components/schemas/ProcessCompletedPayload" } } }] }
    ProcessCancelledEvent: { x-occ-aggregate-id-field: payload.processId, allOf: [{ $ref: "#/components/schemas/EventEnvelope" }, { type: object, required: [type, schemaVersion, aggregateType, payload], properties: { type: { const: process.cancelled }, schemaVersion: { const: 1 }, aggregateType: { const: PROCESS }, payload: { $ref: "#/components/schemas/ProcessCancelledPayload" } } }] }
    ProcessFailedEvent: { x-occ-aggregate-id-field: payload.processId, allOf: [{ $ref: "#/components/schemas/EventEnvelope" }, { type: object, required: [type, schemaVersion, aggregateType, payload], properties: { type: { const: process.failed }, schemaVersion: { const: 1 }, aggregateType: { const: PROCESS }, payload: { $ref: "#/components/schemas/ProcessFailedPayload" } } }] }
