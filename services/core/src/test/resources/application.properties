# Test-only JWT material. These keys are fixed fixtures and must never be used outside tests.
occ.jwt.issuer=https://innorder.test
occ.jwt.private-key-file=classpath:test-only-jwt-private.pem
occ.jwt.public-key-file=classpath:test-only-jwt-public.pem
occ.jwt.ttl=15m
occ.jwt.clock-skew=30s
occ.outbox.enabled=false
spring.profiles.active=test
flowable.database-schema-update=true
